<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abonelik">
<title>Abonelik Yönetimi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<link rel="stylesheet" href="panel.css">
</head>
<body>

<!-- GİRİŞ -->
<div id="giris" class="giris">
  <div class="giris-kart">
    <div class="logo-blok">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <div>
        <div class="logo-ad">Abonelik Yönetimi</div>
        <div class="logo-alt">Kepçe · Macar Zeka · Macar Talimat</div>
      </div>
    </div>
    <h1>Hoş geldin abi</h1>
    <p class="soluk">Devam etmek için panel şifreni gir.</p>
    <label class="alan">
      <span>Şifre</span>
      <input id="sifre" type="password" autocomplete="current-password" placeholder="••••••••••••">
    </label>
    <label class="onay"><input id="hatirla" type="checkbox" checked> Bu cihazda beni hatırla</label>
    <div id="girisHata" class="hata-yazi"></div>
    <button id="girisBtn" class="btn btn-ana btn-genis">Giriş yap</button>
    <div class="giris-alt">Kodlar internetsiz çalışır · Veriler bu cihazda saklanır</div>
  </div>
</div>

<!-- UYGULAMA -->
<div id="uyg" class="uyg gizli">
  <aside class="yan">
    <div class="logo-blok">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <div><div class="logo-ad">Abonelik</div><div class="logo-alt">Yönetim paneli</div></div>
    </div>
    <nav class="menu">
      <button data-sayfa="genel" class="aktif"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg><span>Genel bakış</span></button>
      <button data-sayfa="musteriler"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg><span>Müşteriler</span></button>
      <button data-sayfa="odemeler"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .89-2 2v12c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg><span>Ödemeler</span></button>
      <button data-sayfa="ayarlar"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span>Ayarlar</span></button>
    </nav>
    <div class="yan-alt">
      <div id="yedekUyari" class="yedek-uyari gizli"></div>
      <button id="cikisBtn" class="btn btn-hayalet btn-genis">Çıkış yap</button>
    </div>
  </aside>

  <main class="ana">
    <header class="ust">
      <div>
        <h2 id="baslik">Genel bakış</h2>
        <div id="altBaslik" class="soluk"></div>
      </div>
      <div class="ust-sag">
        <button id="yeniMusteriBtn" class="btn btn-ana"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span>Yeni müşteri</span></button>
      </div>
    </header>
    <div id="icerik" class="icerik"></div>
  </main>
</div>

<div id="modalKok"></div>
<div id="toastKok" class="toast-kok"></div>

<script src="cekirdek.js"></script>
<script src="kasa.js"></script>
<script src="panel.js"></script>
</body>
</html>
